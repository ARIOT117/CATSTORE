ServerName localhost

<Directory /var/www/html>
    AllowOverride None
    Require all denied
</Directory>

<Directory /var/www/html/public>
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.php
    Require all granted
</Directory>
<FilesMatch "(^\.|\.md$)">
    Require all denied
</FilesMatch>

# Railway termina HTTPS antes de reenviar la solicitud al contenedor.
SetEnvIfNoCase X-Forwarded-Proto "^https$" HTTPS=on

# Consumo moderado para una demostración académica con poco tráfico.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 3
    MaxRequestWorkers 8
    MaxConnectionsPerChild 500
</IfModule>
