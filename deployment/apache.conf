ServerName localhost

<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>

# Las reglas del contenedor también protegen carpetas sin .htaccess propio.
<DirectoryMatch "^/var/www/html/(data|scripts|docs|deployment|\.git|\.superdesign)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(^\.|^Dockerfile$|^railway\.json$|^vercel\.json$|\.md$)">
    Require all denied
</FilesMatch>

# Railway termina HTTPS antes de reenviar la solicitud al contenedor.
SetEnvIfNoCase X-Forwarded-Proto "^https$" HTTPS=on

# Consumo moderado para una demostración académica con poco tráfico.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 3
    MaxRequestWorkers 8
    MaxConnectionsPerChild 500
</IfModule>
